<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página Principal</title>
  <style>
    :root{
      --bg:#0f0f12;
      --text:#eaeaf0;
      --muted:#b7b9c6;
      --card-w: 310px;
      --card-h: 300px;
      --radius: 16px;
      --accent: #3aa0ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:28px;
    }
    h1{margin:28px 0 8px;font-weight:700;letter-spacing:.2px;}

    .gallery{
      display:flex;
      flex-wrap:wrap;
      gap:28px;
      justify-content:center;
      padding:0 18px 36px;
      width:min(1180px, 100%);
      perspective: 1200px;
    }

    .card{
      width:var(--card-w);
      height:var(--card-h);
      border-radius: var(--radius);
      position:relative;
      perspective: 1000px;
    }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      transform-style: preserve-3d;
      transition: transform 0.8s ease-in-out;
      border-radius: var(--radius);
      box-shadow: 0 10px 24px rgba(0,0,0,.45);
      overflow:hidden;
    }

    .card-front, .card-back{
      position:absolute;
      inset:0;
      backface-visibility:hidden;
      border-radius: var(--radius);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:22px;
      color:var(--text);
    }

    .card-front::before, .card-back::before{
      content:"";
      position:absolute; inset:0;
      background-size:cover; background-position:center;
      filter: brightness(.8);
      z-index:-1;
    }

    .card[data-img="1"] .card-front::before,
    .card[data-img="1"] .card-back::before{
      background-image:url("https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop");
    }
    .card[data-img="2"] .card-front::before,
    .card[data-img="2"] .card-back::before{
      background-image:url("https://images.unsplash.com/photo-1513475382585-d06e58bcb0ea?q=80&w=1600&auto=format&fit=crop");
    }
    .card[data-img="3"] .card-front::before,
    .card[data-img="3"] .card-back::before{
      background-image:url("https://images.unsplash.com/photo-1495446815901-a7297e633e8d?q=80&w=1600&auto=format&fit=crop");
    }

    .card-back{
      transform: rotateY(180deg);
      background:#14161d;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .title{font-size:22px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.55);}
    .desc{color:var(--muted);font-size:14px;line-height:1.35;max-width:26ch;text-shadow:0 1px 6px rgba(0,0,0,.55);}
    .cta{
      margin-top:12px;
      display:inline-grid; place-items:center;
      width:56px; height:56px;
      border-radius:50%;
      background:#ffffff; color:#111;
      font-size:28px; font-weight:700;
      text-decoration:none;
      box-shadow:0 6px 16px rgba(0,0,0,.35);
      transition: background .3s, color .3s;
    }
    .cta:after{content:"›";}
    .cta:hover{background:var(--accent); color:white;}

    @media (max-width:660px){
      :root{--card-w:92vw;--card-h:260px}
      .desc{max-width:100%}
    }
  </style>
</head>
<body>
  <h1>Página Principal</h1>

  <section class="gallery">
    <a class="card" data-img="1" href="page1.html">
      <div class="card-inner">
        <div class="card-front">
          <div class="title">page1</div>
          <p class="desc">Descripción breve del callout.</p>
          <span class="cta"></span>
        </div>
        <div class="card-back">
          <p>Haz clic para ir a page1</p>
        </div>
      </div>
    </a>

    <a class="card" data-img="2" href="page2.html">
      <div class="card-inner">
        <div class="card-front">
          <div class="title">page2</div>
          <p class="desc">Descripción breve del callout.</p>
          <span class="cta"></span>
        </div>
        <div class="card-back">
          <p>Haz clic para ir a page2</p>
        </div>
      </div>
    </a>

    <a class="card" data-img="3" href="page3.html">
      <div class="card-inner">
        <div class="card-front">
          <div class="title">page3</div>
          <p class="desc">Descripción breve del callout.</p>
          <span class="cta"></span>
        </div>
        <div class="card-back">
          <p>Haz clic para ir a page3</p>
        </div>
      </div>
    </a>
  </section>

  <script>
    document.querySelectorAll('.card').forEach(card=>{
      const inner = card.querySelector('.card-inner');
      card.addEventListener('mouseenter', e=>{
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left; // posición del mouse dentro de la card
        if(x < rect.width/2){
          inner.style.transform = "rotateY(-45deg)"; // gira a la izquierda
        } else {
          inner.style.transform = "rotateY(45deg)";  // gira a la derecha
        }
      });
      card.addEventListener('mouseleave', ()=>{
        inner.style.transform = "rotateY(0deg)"; // vuelve al frente
      });
    });
  </script>
</body>
</html>
